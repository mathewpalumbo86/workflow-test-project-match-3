<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Lock zoom so taps on the grid never zoom or scroll the page. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1f2a" />
    <!-- Empty icon: stops the browser asking for a favicon file that is not there. -->
    <link rel="icon" href="data:," />
    <title>Workflow Test Project (Match 3)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1f2a;
        overflow: hidden;
        /* Stop the browser handling swipes, long-presses and text selection. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* On-screen error box: a phone browser has no console to look at. */
      #error {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 40%;
        overflow: auto;
        margin: 0;
        padding: 12px;
        background: #7a1420;
        color: #fff;
        font: 12px/1.4 ui-monospace, monospace;
        white-space: pre-wrap;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <pre id="error"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
